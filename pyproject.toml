[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "promptmoge"
version = "1.0.0"
description = "LiDAR-prompted MoGe-3: metric depth from RGB + a phone LiDAR, with two real-time on-device models"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = ["torch>=2.4", "numpy", "scipy", "opencv-python", "pillow", "huggingface_hub", "utils3d_moge @ git+https://github.com/EasternJournalist/utils3d-moge.git@62f09d58509485564e24d5d9f6aac9ee9ebc0c37"]

[project.optional-dependencies]
export = ["coremltools>=8.0"]

[tool.setuptools.packages.find]
include = ["promptmoge*", "moge*"]

[tool.setuptools.package-data]
promptmoge = ["train/calibration/*.json"]
